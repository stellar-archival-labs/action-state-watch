name: 'State Watch'
description: 'Monitor deployed Soroban contracts for TTL/state-archival risk on a schedule and alert via Slack, Discord, or GitHub Issues before persistent data is evicted.'
branding:
  icon: 'activity'
  color: 'purple'
inputs:
  sentinel-cli-path:
    description: 'Path to the soroban-state-sentinel binary, or "install" to fetch it'
    required: false
    default: 'install'
  sentinel-version:
    description: 'soroban-state-sentinel release tag to install when sentinel-cli-path is "install"'
    required: false
    default: 'v0.1.0'
  config-path:
    description: 'Path to the contracts.yml config file'
    required: false
    default: 'contracts.yml'
  rpc-url:
    description: 'Stellar RPC node URL for querying contract state'
    required: true
  slack-webhook-url:
    description: 'Slack incoming webhook URL for alerts'
    required: false
  discord-webhook-url:
    description: 'Discord webhook URL for alerts'
    required: false
  github-token:
    description: 'GitHub token for creating/deduplicating issues'
    required: false
  fail-on-critical:
    description: 'Fail the run when a contract is Critical or Archived. Set to "false" for workflows that only want alerts'
    required: false
    default: 'true'
outputs:
  contracts-critical:
    description: 'JSON array of contract addresses in Critical or Archived state'
  restore-xdr-artifact:
    description: 'Name of the uploaded workflow artifact containing unsigned restore XDR'
runs:
  using: 'node24'
  main: 'dist/index.js'
